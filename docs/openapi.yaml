openapi: 3.0.3
info:
  title: DataPulse Latam API
  version: 1.0.0
paths:
  /api/alertas/:
    get:
      operationId: alertas_list
      parameters:
      - in: query
        name: leida
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: severidad
        schema:
          type: string
          enum:
          - CRITICAL
          - INFO
          - WARNING
        description: |-
          * `INFO` - Información
          * `WARNING` - Advertencia
          * `CRITICAL` - Crítica
      - in: query
        name: tipo
        schema:
          type: string
      - in: query
        name: tipo_alerta
        schema:
          type: string
          enum:
          - INDICADOR
          - RIESGO
          - TIPO_CAMBIO
        description: |-
          * `RIESGO` - Riesgo
          * `TIPO_CAMBIO` - Tipo de cambio
          * `INDICADOR` - Indicador
      tags:
      - alertas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertaList'
          description: ''
        '429':
          description: 'Error uniforme. 429: throttled o account_locked; 400: captcha_required
            o validation_error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Segundos de espera.
  /api/alertas/{id}/:
    get:
      operationId: alertas_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este alerta.
