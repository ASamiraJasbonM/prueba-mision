        anio:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        fuente:
          $ref: '#/components/schemas/FuenteEnum'
        fecha_actualizacion:
          type: string
          format: date-time
        pais:
          type: string
      required:
