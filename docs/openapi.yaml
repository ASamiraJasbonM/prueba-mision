components:
  schemas:
    AccionEnum:
      enum:
      - CREAR
      - EDITAR
      - ELIMINAR
      - CONSULTAR
      - LOGIN
      - EXPORT
      - LOGIN_FALLIDO
      - LOGIN_BLOQUEADO
      - PASSWORD_CHANGE
      - MFA_ENROLL
      - MFA_VERIFY_OK
      - MFA_VERIFY_FAIL
      - MFA_DISABLE
      - CORRECCION
      type: string
      description: |-
        * `CREAR` - Crear
        * `EDITAR` - Editar
        * `ELIMINAR` - Eliminar
        * `CONSULTAR` - Consultar
        * `LOGIN` - Login
        * `EXPORT` - Exportar
        * `LOGIN_FALLIDO` - Login fallido
        * `LOGIN_BLOQUEADO` - Login bloqueado
        * `PASSWORD_CHANGE` - Cambio de contraseña
        * `MFA_ENROLL` - Enrolar MFA
        * `MFA_VERIFY_OK` - Verificación MFA correcta
        * `MFA_VERIFY_FAIL` - Verificación MFA fallida
        * `MFA_DISABLE` - Deshabilitar MFA
        * `CORRECCION` - Corrección de auditoría
    AlertSummary:
      type: object
      properties:
        total:
          type: integer
        no_leidas:
          type: integer
        por_tipo:
          type: object
          additionalProperties:
            type: integer
        por_severidad:
          type: object
          additionalProperties:
            type: integer
      required:
      - no_leidas
      - por_severidad
      - por_tipo
      - total
    Alerta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        usuario:
          type: integer
          nullable: true
        pais:
          type: string
        tipo_alerta:
          $ref: '#/components/schemas/TipoAlertaEnum'
        severidad:
          $ref: '#/components/schemas/SeveridadEnum'
        titulo:
          type: string
          maxLength: 200
        mensaje:
          type: string
        leida:
          type: boolean
          readOnly: true
        fecha_creacion:
          type: string
          format: date-time
      required:
      - id
      - leida
      - mensaje
      - pais
      - severidad
      - tipo_alerta
      - titulo
    Availability:
      type: object
      properties:
        disponible:
          type: boolean
      required:
      - disponible
    Cambio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        moneda_destino:
          type: string
          default: USD
          maxLength: 3
        tasa:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,12})?$
        fecha:
          type: string
          format: date
        variacion_porcentual:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
          nullable: true
        fuente:
          type: string
          maxLength: 100
        moneda_origen:
          type: string
      required:
      - fecha
      - id
      - moneda_origen
      - tasa
    Captcha:
      type: object
      properties:
        captcha_key:
          type: string
        image_url:
          type: string
      required:
      - captcha_key
      - image_url
    Code:
      type: object
      properties:
        code:
          type: string
          maxLength: 128
      required:
      - code
    DashboardSummary:
      type: object
      properties:
        total_paises:
          type: integer
        alertas_activas:
          type: integer
        portafolios_usuario:
          type: integer
        promedio_irpc_region:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        paises_con_irpc:
          type: integer
        paises_irpc_parcial:
          type: integer
        paises_con_datos_no_verificados:
          type: integer
        paises_con_datos_rezagados:
          type: integer
      required:
      - alertas_activas
      - paises_con_datos_no_verificados
      - paises_con_datos_rezagados
      - paises_con_irpc
      - paises_irpc_parcial
      - portafolios_usuario
      - promedio_irpc_region
      - total_paises
    Distribution:
      type: object
      properties:
        codigo:
          type: string
        monto_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        porcentaje:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
      required:
      - codigo
      - monto_usd
      - porcentaje
    Enrollment:
      type: object
      properties:
        otpauth_url:
          type: string
        qr:
          type: string
      required:
      - otpauth_url
      - qr
    ErrorContent:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
      required:
      - code
      - details
      - message
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
    EstadoEnum:
      enum:
      - PENDIENTE
      - EJECUTANDO
      - COMPLETADA
      - PARCIAL
      - FALLIDA
      type: string
      description: |-
        * `PENDIENTE` - PENDIENTE
        * `EJECUTANDO` - EJECUTANDO
        * `COMPLETADA` - COMPLETADA
        * `PARCIAL` - PARCIAL
        * `FALLIDA` - FALLIDA
    FuenteEnum:
      enum:
      - WORLD_BANK
      - MANUAL
      - DEMO_SINTETICO
      type: string
      description: |-
        * `WORLD_BANK` - World Bank
        * `MANUAL` - Manual
        * `DEMO_SINTETICO` - Demostración sintética
    Indicador:
      type: object
      properties:
