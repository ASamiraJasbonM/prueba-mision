  /api/auditoria/:
    get:
      operationId: auditoria_list
      parameters:
      - in: query
        name: accion
        schema:
          type: string
          enum:
          - CONSULTAR
          - CORRECCION
          - CREAR
          - EDITAR
          - ELIMINAR
          - EXPORT
          - LOGIN
          - LOGIN_BLOQUEADO
          - LOGIN_FALLIDO
          - MFA_DISABLE
          - MFA_ENROLL
          - MFA_VERIFY_FAIL
          - MFA_VERIFY_OK
          - PASSWORD_CHANGE
        description: |-
          * `CREAR` - Crear
          * `EDITAR` - Editar
          * `ELIMINAR` - Eliminar
          * `CONSULTAR` - Consultar
          * `LOGIN` - Login
          * `EXPORT` - Exportar
          * `LOGIN_FALLIDO` - Login fallido
          * `LOGIN_BLOQUEADO` - Login bloqueado
          * `PASSWORD_CHANGE` - Cambio de contraseña
          * `MFA_ENROLL` - Enrolar MFA
          * `MFA_VERIFY_OK` - Verificación MFA correcta
          * `MFA_VERIFY_FAIL` - Verificación MFA fallida
          * `MFA_DISABLE` - Deshabilitar MFA
          * `CORRECCION` - Corrección de auditoría
      - in: query
        name: entidad_afectada
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: usuario
        schema:
          type: integer
      tags:
      - auditoria
      security:
