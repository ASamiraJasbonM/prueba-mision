[project]
name = "datapulse-backend"
version = "1.0.0"
description = "Backend Django y DRF de DataPulse Latam"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==5.2.19",
    "djangorestframework==3.18.2",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.9.0",
    "django-environ==0.14.0",
    "django-filter==26.2",
    "drf-spectacular==0.30.0",
    "psycopg[binary]==3.3.9",
    "reportlab==5.1.0",
    "requests==2.34.2",
    "PyYAML==6.0.3",
    "pillow==13.0.0",
    "gunicorn==27.0.1",
    "django-axes>=9.0.0",
    "django-simple-captcha>=0.8.0",
    "django-csp>=4.0",
    "drf-spectacular-sidecar>=2026.10.1",
    "django-otp>=1.7.5",
    "qrcode>=8.2",
    "cryptography>=50.0.2",
]

[dependency-groups]
# Test runner remains Django/unittest; scanners are development/CI only.
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[tool.uv]
package = false
default-groups = ["dev"]
compile-bytecode = true
# Preserve the previously verified transitive versions without making them direct.
constraint-dependencies = [
    "asgiref==3.13.0",
    "attrs==26.1.0",
    "certifi==2026.10.23",
    "charset-normalizer==3.5.2",
    "idna==3.20",
    "inflection==0.5.1",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "psycopg-binary==3.3.9",
    "PyJWT==2.15.1",
    "referencing==0.37.0",
    "rpds-py==2026.9.1",
    "sqlparse==0.6.1",
    "typing-extensions==4.16.0",
    "tzdata==2026.6",
    "uritemplate==4.2.0",
    "urllib3==2.8.0",
]
