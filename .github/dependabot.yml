version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Solo actualiza package-lock.json dentro de los rangos declarados (~ y ^),
    # sin reescribir el manifest a majors/minors incompatibles con Angular 20.
    versioning-strategy: lockfile-only
    groups:
      frontend-dependencies:
        patterns: ['*']
    # Guardas explícitas de las peer deps de Angular 20: TypeScript 5.x,
    # zone.js 0.15.x y jasmine 5.x. Evitan bumps que rompen `npm ci`.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      - dependency-name: "@angular/*"
        versions: [">=21.0.0"]
      - dependency-name: "zone.js"
        versions: [">=0.16.0"]
      - dependency-name: "@types/jasmine"
        versions: [">=6.0.0"]
      - dependency-name: "jasmine-core"
        versions: [">=6.0.0"]
  # Native uv ecosystem updates pyproject.toml and uv.lock together.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Django 5.2 LTS is the supported line on Python 3.12. Keep patch
    # updates enabled; a framework/runtime migration requires its own review.
    # The failed updater attempted django==6.1.3 alongside Django==5.2.19.
    ignore:
      - dependency-name: django
        versions: [">=5.3"]
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/, /frontend]
    schedule:
      interval: weekly
