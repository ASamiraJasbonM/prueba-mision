version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns: ['*']
    # Angular 20 solo soporta TypeScript 5.x. Dependabot propuso Angular 22
    # (requiere TypeScript >=6 <6.1) junto a TypeScript 7, rompiendo `npm ci`.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      - dependency-name: "@angular/*"
        versions: [">=21.0.0"]
  # Native uv ecosystem updates pyproject.toml and uv.lock together.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/, /frontend]
    schedule:
      interval: weekly
