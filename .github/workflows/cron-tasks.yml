name: Cron de sincronización programada

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datapulse-production-maintenance
  cancel-in-progress: false

jobs:
  sync-diaria:
    name: sync-${{ matrix.task }}
    # Never expose database credentials to PRs or manually selected branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [indicadores, tipos_cambio]
    environment: production-maintenance
    env:
      SECRET_KEY: ${{ secrets.DATAPULSE_SECRET_KEY }}
      AUDIT_HMAC_KEY: ${{ secrets.DATAPULSE_AUDIT_HMAC_KEY }}
      FIELD_ENCRYPTION_KEY: ${{ secrets.DATAPULSE_FIELD_ENCRYPTION_KEY }}
      MFA_KEY: ${{ secrets.DATAPULSE_MFA_KEY }}
      DATABASE_URL: ${{ secrets.DATAPULSE_DATABASE_URL }}
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "True"
      CAPTCHA_ENFORCED: "True"
      API_DOCS_ENABLED: "False"
      EXTERNAL_API_TIMEOUT: "5"
    steps:
      - uses: actions/checkout@v4
      - name: Require production configuration and encrypted PostgreSQL
        run: |
          set -euo pipefail
          for key in SECRET_KEY AUDIT_HMAC_KEY FIELD_ENCRYPTION_KEY MFA_KEY DATABASE_URL; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing maintenance secret: $key"
              exit 1
            fi
          done
          python - <<'PY'
          import os
          from urllib.parse import urlsplit, parse_qs
          url = urlsplit(os.environ['DATABASE_URL'])
          if url.scheme not in ('postgres', 'postgresql') or not url.hostname or parse_qs(url.query).get('sslmode') not in (['require'], ['verify-ca'], ['verify-full']):
              raise SystemExit('DATABASE_URL must use external PostgreSQL with sslmode=require or stronger.')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --no-dev
      - name: Verify schema is current without changing production
        run: uv run --frozen --no-dev python backend/manage.py migrate --check
      - name: Verify audit chain before maintenance
        run: uv run --frozen --no-dev python backend/manage.py verificar_auditoria
      - name: Sync selected source and recalculate IRPC
        run: |
          set -euo pipefail
          uv run --frozen --no-dev python backend/manage.py sync_diaria --task "$SYNC_TASK" | tee maintenance-report.json
        env:
          SYNC_TASK: ${{ matrix.task }}
      - name: Verify audit chain after maintenance
        if: ${{ !cancelled() }}
        run: uv run --frozen --no-dev python backend/manage.py verificar_auditoria
      - name: Preserve the business result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-${{ matrix.task }}
          path: maintenance-report.json
          if-no-files-found: ignore
          retention-days: 7
